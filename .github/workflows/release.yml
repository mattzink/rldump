name: Release

on:
  push:
    branches: [main]

# Publishes must land in commit order: "Latest" tracks the newest published
# build, and a stale build that finishes after a newer one must not win it.
# Queue concurrent runs (never cancel them).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-test-publish:
    name: Build, Test, Publish
    runs-on: ubuntu-latest
    steps:
      # Full clone: the release-notes step needs the push's before-commit
      # (event.before) to compute the commit range.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      # Version: major.minor from the <Version> in src/rldump/rldump.csproj,
      # patch part is the run number (gravwar-style), so every published build
      # has a unique version.
      - name: Compute version
        id: version
        run: |
          BASE=$(sed -n 's/.*<Version>\([0-9][0-9]*\.[0-9][0-9]*\)\..*/\1/p' src/rldump/rldump.csproj)
          echo "RLDUMP_VERSION=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "version=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # setup (dotnet restore) must run before build, which uses --no-restore.
      - run: mise trust
      - run: mise install
      - run: mise run setup
      - run: mise run build
      - run: mise run test
      # The publish task stamps the binary with RLDUMP_VERSION when it is set.
      - run: mise run publish

      # Smoke-check the AOT binary: it must run standalone with no runtime and
      # report the stamped version.
      - run: ./dist/rldump --help
      - run: '[ "$(./dist/rldump --version)" = "$RLDUMP_VERSION" ]'

      # Ship the binary + example config as a single compressed tarball,
      # named with the stamped version.
      - name: Package release tarball
        run: |
          if ! command -v zstd >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi
          mkdir -p package
          cp dist/rldump package/rldump
          cp rldump.json.example package/rldump.json.example
          tar -C package -cf - . | zstd -q -o "rldump-linux-x64-${RLDUMP_VERSION}.tar.zstd"

      # archive: false → the artifact IS the tarball (not a zip wrapping it).
      - uses: actions/upload-artifact@v7
        with:
          name: rldump-linux-x64-${{ steps.version.outputs.version }}.tar.zstd
          path: rldump-linux-x64-${{ steps.version.outputs.version }}.tar.zstd
          archive: false

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # GitHub's generate_release_notes only lists merged PRs and closed
          # issues, which is useless for a project that commits directly to
          # main — so this step writes the notes itself: the archive reference
          # plus the commits in this push (event.before..GITHUB_SHA, read
          # from the event payload JSON).
          BEFORE=$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")
          # event.after == GITHUB_SHA for push events. A zero/missing
          # `before` (branch-creating push) has no usable range: list the
          # release commit alone.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${GITHUB_SHA}~1..${GITHUB_SHA}"
          else
            RANGE="${BEFORE}..${GITHUB_SHA}"
          fi
          {
            echo "**Archive:** \`rldump-linux-x64-${VERSION}.tar.zstd\`"
            echo
            echo '```bash'
            echo "curl -fsSLO \"https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/rldump-linux-x64-${VERSION}.tar.zstd\""
            echo '```'
            echo
            echo "## Commits"
            git log --no-merges --pretty=format:"- [%h](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/%H) %s (%an)" "$RANGE"
            echo
          } > release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: rldump-linux-x64-${{ steps.version.outputs.version }}.tar.zstd
